kind = "web"
previewPath = "/"
title = "Tribo Hooponopower — Página de Vendas"
version = "1.0.0"
id = "artifacts/tribo-vendas"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24727

[services.development]
run = "pnpm --filter @workspace/tribo-vendas run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tribo-vendas", "run", "build" ]
publicDir = "artifacts/tribo-vendas/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24727"
BASE_PATH = "/"
